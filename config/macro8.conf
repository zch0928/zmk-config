# 设备名（BLE 显示名称）
CONFIG_ZMK_KEYBOARD_NAME="MacroKey"

# USB
CONFIG_ZMK_USB=y

# 蓝牙
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# RGB（GL5050）
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_WS2812_STRIP=y

# 电池电量上报（禁用：ZMK v0.3 的 battery_voltage_divider.c 使用旧版 nrfx 2.x API，
# 与 Zephyr 4.1.0 附带的 nrfx 3.x 不兼容，SAADC_CH_PSELP_PSELP_AnalogInput0 已被移除）
CONFIG_ZMK_BATTERY_REPORTING=n

# 睡眠省电（15分钟无操作进入深度睡眠）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000